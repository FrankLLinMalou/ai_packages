name: Apply v3 staged update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v3-staged-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify staged update
        run: |
          curl -L --fail --retry 3 --retry-all-errors \
            -o /tmp/v3-update.zip \
            "https://github.com/FrankLLinMalou/ai_packages/releases/download/v2.1.0/staged-v3-update-03c422e5.zip"
          echo "03c422e53f42f431fd87ca7f33581ac5d0168831504b9b298462d7ea76c5f164  /tmp/v3-update.zip" | sha256sum --check

      - name: Extract update with recorded modes
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive = Path("/tmp/v3-update.zip")
          destination = Path("/tmp/v3-update")
          destination.mkdir(parents=True)
          with zipfile.ZipFile(archive) as source:
              for info in source.infolist():
                  relative = Path(info.filename)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise ValueError(f"Unsafe archive path: {info.filename}")
              source.extractall(destination)
              for info in source.infolist():
                  if info.is_dir():
                      continue
                  mode = (info.external_attr >> 16) & 0o777
                  os.chmod(destination / info.filename, mode or 0o644)
          PY

      - name: Apply and commit v3.0.0
        run: |
          rsync -a --delete --exclude='.git/' \
            /tmp/v3-update/zh-complex-project-orchestrator/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: update orchestrator to 3.0.0"
          git push origin HEAD:main