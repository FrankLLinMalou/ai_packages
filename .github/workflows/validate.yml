name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare canonical skill directory
        run: |
          mkdir -p ../zh-complex-project-orchestrator
          git archive HEAD | tar -x -C ../zh-complex-project-orchestrator

      - name: Validate repository
        env:
          PYTHONUTF8: "1"
        run: python3 ../zh-complex-project-orchestrator/scripts/validate_repo.py

      - name: Build release archive
        run: python3 ../zh-complex-project-orchestrator/scripts/package_skill.py

      - name: Verify deterministic rebuild
        run: |
          python3 ../zh-complex-project-orchestrator/scripts/package_skill.py --output /tmp/zh-complex-project-orchestrator-rebuild.zip
          cmp --silent "../zh-complex-project-orchestrator/dist/zh-complex-project-orchestrator-$(cat VERSION).zip" /tmp/zh-complex-project-orchestrator-rebuild.zip

      - name: Test release archive
        run: unzip -t "../zh-complex-project-orchestrator/dist/zh-complex-project-orchestrator-$(cat VERSION).zip"
